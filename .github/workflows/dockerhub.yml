---
name: docker.io

on:
  push:
    branches:
      - main

  schedule:
    - cron: 0 0 * * 0

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest

    env:
      CONTAINER_REGISTRY: docker.io
      CONTAINER_REPOSITORY: andreswebs/jwt-authorizer-lambda

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `latest` is published by the release workflow, not from the tip of main,
      # so that it names a tagged, signed, attested version. The weekly rebuild
      # refreshes `edge` with base-image patches without moving `latest` under
      # anyone who pinned it.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            latest=false
            prefix=
            suffix=
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=edge
          images: |
            ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_REPOSITORY }}

      - name: Login to Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
